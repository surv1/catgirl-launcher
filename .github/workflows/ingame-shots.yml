# Real in-game screenshots of the Catgirl mod + Catgirl Pack (local server, Fabric client on a
# virtual screen). The pictures are pushed to the "ci-shots" branch.
name: In-game screenshots

on:
  workflow_dispatch:
    inputs:
      note:
        description: "What this run is for"
        default: ""

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    env:
      MC: "1.21.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build the mod
        working-directory: mod
        run: |
          set -euo pipefail
          LOADER=$(curl -fsSL "https://meta.fabricmc.net/v2/versions/loader/$MC" | jq -r '([.[] | select(.loader.stable)][0] // .[0]).loader.version')
          FAPI=$(curl -fsSL -A 'catgirl-launcher-ci' "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22$MC%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].version_number')
          LOOM=$(curl -fsSL https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
          sed -i "s/^minecraft_version=.*/minecraft_version=$MC/; s/^loader_version=.*/loader_version=$LOADER/; s/^fabric_version=.*/fabric_version=$FAPI/; s/^loom_version=.*/loom_version=$LOOM/; s/^mod_version=.*/mod_version=0.0.0-test/" gradle.properties
          gradle build --no-daemon -q 2>&1 | tail -30
      - name: Build the pack
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg xvfb xdotool imagemagick libgl1-mesa-dri > /dev/null
          pip install -q pillow numpy scipy portablemc
          python3 texture-pack/tools/build_pack.py texture-pack/src/skin.png packout
      - name: Set up game and server
        run: |
          set -euo pipefail
          G=$PWD/game S=$PWD/server
          mkdir -p $G/mods $G/resourcepacks $S
          cp packout/CatgirlPack.zip $G/resourcepacks/
          cp "$(ls mod/build/libs/*.jar | grep -v -- '-sources' | head -1)" $G/mods/catgirl.jar
          FURL=$(curl -fsSL -A 'catgirl-launcher-ci' "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22$MC%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].files[0].url')
          curl -fsSL "$FURL" -o $G/mods/fabric-api.jar
          V=$(curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r --arg v "$MC" '.versions[] | select(.id==$v) | .url')
          curl -fsSL "$(curl -fsSL "$V" | jq -r .downloads.server.url)" -o $S/server.jar
          portablemc --main-dir $G --work-dir $G start --dry "fabric:$MC" > /dev/null
      - name: Play and take pictures
        run: |
          export JAVA_HOME=$JAVA_HOME_21_X64 PATH=$JAVA_HOME_21_X64/bin:$PATH
          G=$PWD/game S=$PWD/server OUT=$PWD/shots bash texture-pack/tools/ingame/shots.sh
          echo "::notice title=shots::$(ls shots | tr '\n' ' ')"
          echo "::notice title=warnings::$(cut -c1-200 shots/warnings.txt | tr '\n' '|' | head -c 3000)"
      - name: Push the pictures
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b ci-shots && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots for ${GITHUB_SHA::7} ${{ inputs.note }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots
