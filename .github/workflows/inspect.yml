# Developer tool: prints the method signatures of Minecraft/Fabric classes we build on,
# as build annotations, so the mod can be written against the exact current API.
# It doesn't build or publish anything.
name: Inspect API

on:
  workflow_dispatch:
    inputs:
      mc:
        description: "Minecraft version"
        default: "1.21.11"
      classes:
        description: "Space-separated class names to inspect"
        required: true

permissions:
  contents: read
  checks: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Pick Fabric versions
        working-directory: mod
        run: |
          set -euo pipefail
          MC='${{ inputs.mc }}'
          LOADER=$(curl -fsSL "https://meta.fabricmc.net/v2/versions/loader/$MC" | jq -r '([.[] | select(.loader.stable)][0] // .[0]).loader.version')
          FAPI=$(curl -fsSL -A 'catgirl-launcher-ci' "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22$MC%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].version_number')
          LOOM=$(curl -fsSL https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
          sed -i "s/^minecraft_version=.*/minecraft_version=$MC/; s/^loader_version=.*/loader_version=$LOADER/; s/^fabric_version=.*/fabric_version=$FAPI/; s/^loom_version=.*/loom_version=$LOOM/" gradle.properties
      - name: Prepare Minecraft
        working-directory: mod
        run: gradle compileJava --no-daemon -q || true
      - name: Collect signatures
        shell: bash
        run: |
          set +e
          JARS=$(find ~/.gradle /home/runner/work -name '*.jar' \( -path '*loom*' -o -path '*minecraftMaven*' \) 2>/dev/null | grep -Ei 'minecraft-(merged|client|common)|fabric-(rendering|api-base|lifecycle|entity|renderer)' | tr '\n' ':')
          mkdir -p /tmp/out
          for C in ${{ inputs.classes }}; do
            F=/tmp/out/all.txt
            echo "##### $C" >> $F
            case "$C" in
              *Layer) javap -p -c -cp "$JARS" "$C" 2>&1 | grep -E 'invoke|getfield|getstatic|class |public|protected|private' >> $F ;;
              *) javap -p -cp "$JARS" "$C" 2>&1 | grep -v '^Compiled' >> $F ;;
            esac
          done
          split -b 3900 -d -a 2 /tmp/out/all.txt /tmp/out/part-
          ls /tmp/out | head -60
      - name: Emit 1
        shell: bash
        run: for i in 00 01 02 03 04 05 06 07 08 09; do f=/tmp/out/part-$i; [ -f $f ] && echo "::notice title=part-$i::$(sed 's/%/%25/g' $f | sed ':a;N;$!ba;s/\n/%0A/g')"; done; true
      - name: Emit 2
        shell: bash
        run: for i in $(seq 10 19); do f=/tmp/out/part-$i; [ -f $f ] && echo "::notice title=part-$i::$(sed 's/%/%25/g' $f | sed ':a;N;$!ba;s/\n/%0A/g')"; done; true
      - name: Emit 3
        shell: bash
        run: for i in $(seq 20 29); do f=/tmp/out/part-$i; [ -f $f ] && echo "::notice title=part-$i::$(sed 's/%/%25/g' $f | sed ':a;N;$!ba;s/\n/%0A/g')"; done; true
      - name: Emit 4
        shell: bash
        run: for i in $(seq 30 39); do f=/tmp/out/part-$i; [ -f $f ] && echo "::notice title=part-$i::$(sed 's/%/%25/g' $f | sed ':a;N;$!ba;s/\n/%0A/g')"; done; true
      - name: Emit 5
        shell: bash
        run: for i in $(seq 40 49); do f=/tmp/out/part-$i; [ -f $f ] && echo "::notice title=part-$i::$(sed 's/%/%25/g' $f | sed ':a;N;$!ba;s/\n/%0A/g')"; done; true
