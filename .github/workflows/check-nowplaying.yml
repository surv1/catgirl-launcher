# Developer tool: runs the "Now playing" helper on Windows for a few seconds and shows what it
# printed, to make sure the script runs. (Build servers have no music playing, so expect "none".)
name: Check now-playing helper

on: workflow_dispatch

jobs:
  run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Album art conversion
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $b = New-Object System.Drawing.Bitmap 300, 300
          $g = [System.Drawing.Graphics]::FromImage($b); $g.Clear([System.Drawing.Color]::HotPink); $g.Dispose()
          $b.Save("$PWD\cover.jpg", [System.Drawing.Imaging.ImageFormat]::Jpeg)
          $r = powershell.exe -NoProfile -ExecutionPolicy Bypass -File mod/src/main/resources/assets/catgirl/nowplaying.ps1 -TestArt "$PWD\cover.jpg" 2>&1 | Out-String
          Write-Output "::notice title=art::$($r -replace "`r?`n", ' | ')"
      - name: Run helper for 8 seconds
        shell: powershell
        run: |
          $p = Start-Process powershell.exe -ArgumentList '-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File','mod/src/main/resources/assets/catgirl/nowplaying.ps1' -RedirectStandardOutput out.txt -RedirectStandardError err.txt -PassThru -NoNewWindow
          Start-Sleep -Seconds 8
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          $out = (Get-Content out.txt -Raw) -replace "`r?`n", ' | '
          $err = (Get-Content err.txt -Raw) -replace "`r?`n", ' | '
          Write-Output "::notice title=stdout::$out"
          Write-Output "::notice title=stderr::$err"
